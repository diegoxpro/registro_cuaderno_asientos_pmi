version: '3.8'

services:
  # Servicio Web Next.js (Cuaderno Digital de Asientos GORE Lambayeque)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gore_cuaderno_asientos_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cuaderno_db?schema=public
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@regionlambayeque.gob.pe}
      - SESSION_SECRET=${SESSION_SECRET:?Defina SESSION_SECRET en el archivo .env (minimo 32 caracteres)}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    depends_on:
      - db
    restart: always

  # Base de Datos PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: gore_cuaderno_asientos_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cuaderno_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
